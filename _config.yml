title: Donghyeon Kwon
first_name: Donghyeon
last_name: Kwon
email: kinux98@gmail.com
description: >-
  Donghyeon Kwon is a researcher working on data-efficient learning,
  computer vision, and generative AI.
url: https://kinux98.github.io
baseurl: ""
lang: en
timezone: Asia/Seoul
cv_path: /assets/pdf/Donghyeon_Kwon_CV.pdf
scholar_userid: Xy8bpc8AAAAJ
github_username: kinux98
linkedin_username: donghyeon-kwon-7b0a09162

include: [_pages, .nojekyll]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - scripts
  - vendor
  - .bundle
  - .github
  - .ruby-version
  - .gitignore

markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll/scholar
  - jekyll-sitemap
collections:
  news:
    output: true
    permalink: /news/:title/
defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: post
  - scope:
      path: assets
    values:
      sitemap: false

scholar:
  style: apa
  locale: en
  source: ./_bibliography
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex]
  sort_by: none
  group_by: none
  query: "@*"
