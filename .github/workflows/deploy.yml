name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
      - name: Validate HTML, publications and local links
        run: |
          python3 scripts/check_site.py _site
          node --check assets/js/theme.js
      - name: Report source inventory
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          def inventory(ref):
              rows = subprocess.check_output(['git', 'ls-tree', '-r', '-l', ref], text=True).splitlines()
              sizes = [int(row.split()[3]) for row in rows if row.split()[3].isdigit()]
              return len(sizes), sum(sizes)
          print('SOURCE AFTER:', inventory('HEAD'))
          base = os.environ.get('BASE_SHA', '')
          if base and set(base) != {'0'}:
              print('SOURCE BEFORE:', inventory(base))
              subprocess.run(['git', 'diff', '--shortstat', base, 'HEAD'], check=True)
          PY
      - name: Upload tested preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: site-preview
          path: _site
      - name: Publish tested output
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
